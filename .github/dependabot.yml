version: 2
updates:
  - package-ecosystem: gomod
    groups:
      go-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    groups:
      github-actions:
        patterns: ["*"]
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
